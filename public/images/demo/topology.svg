<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de topología de laboratorio sintético</title>
  <desc id="desc">Tres hosts de ejemplo conectados en una red de documentación. Es una ilustración de demostración, no una captura de evidencia real.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#162433" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#56dce8"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#56dce8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#56dce8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#08101a"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.75"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <text x="64" y="64" fill="#56dce8" font-family="monospace" font-size="15" letter-spacing="3">DEMO / ENTORNO SINTÉTICO</text>
  <text x="1136" y="64" text-anchor="end" fill="#77879b" font-family="monospace" font-size="13" letter-spacing="2">NO ES EVIDENCIA REAL</text>

  <text x="64" y="122" fill="#e8eff7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Topología de referencia · módulo 02</text>
  <text x="64" y="154" fill="#77879b" font-family="monospace" font-size="14" letter-spacing="1">Rangos reservados para documentación · RFC 5737</text>

  <line x1="64" y1="184" x2="1136" y2="184" stroke="#1c2937"/>

  <!-- Network bus -->
  <path d="M160 540H1020" stroke="#2b3c50" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="600" y="574" text-anchor="middle" fill="#77879b" font-family="monospace" font-size="13" letter-spacing="2">RED DE LABORATORIO / 192.0.2.0/24</text>

  <!-- WIN client -->
  <g>
    <rect x="118" y="290" width="280" height="160" fill="#0b131d" stroke="#2b3c50"/>
    <rect x="118" y="290" width="280" height="4" fill="#56dce8" opacity="0.7"/>
    <text x="142" y="330" fill="#77879b" font-family="monospace" font-size="12" letter-spacing="2">ENDPOINT / WINDOWS</text>
    <text x="142" y="366" fill="#e8eff7" font-family="monospace" font-size="21" font-weight="500">WIN-CLIENT-01</text>
    <text x="142" y="396" fill="#77879b" font-family="monospace" font-size="12">192.0.2.15</text>
    <text x="142" y="424" fill="#56dce8" font-family="monospace" font-size="12">Eventos 4624 / 4625</text>
    <line x1="258" y1="450" x2="258" y2="540" stroke="#56dce8" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- DC -->
  <g>
    <rect x="462" y="238" width="276" height="160" fill="#0b131d" stroke="#2b3c50"/>
    <rect x="462" y="238" width="276" height="4" fill="#56dce8" opacity="0.35"/>
    <text x="486" y="278" fill="#77879b" font-family="monospace" font-size="12" letter-spacing="2">IDENTITY / DOMAIN</text>
    <text x="486" y="314" fill="#e8eff7" font-family="monospace" font-size="21" font-weight="500">DC-01</text>
    <text x="486" y="344" fill="#77879b" font-family="monospace" font-size="12">198.51.100.10</text>
    <text x="486" y="372" fill="#56dce8" font-family="monospace" font-size="12">Autenticación del dominio</text>
    <line x1="600" y1="398" x2="600" y2="540" stroke="#56dce8" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- SIEM -->
  <g>
    <rect x="824" y="290" width="276" height="160" fill="#0b131d" stroke="#2b3c50"/>
    <rect x="824" y="290" width="276" height="4" fill="#56dce8" opacity="0.7"/>
    <text x="848" y="330" fill="#77879b" font-family="monospace" font-size="12" letter-spacing="2">MONITORING / COLLECTOR</text>
    <text x="848" y="366" fill="#e8eff7" font-family="monospace" font-size="21" font-weight="500">SIEM-LAB</text>
    <text x="848" y="396" fill="#77879b" font-family="monospace" font-size="12">203.0.113.20</text>
    <text x="848" y="424" fill="#56dce8" font-family="monospace" font-size="12">Correlación de eventos</text>
    <line x1="962" y1="450" x2="962" y2="540" stroke="#56dce8" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Flow labels -->
  <text x="320" y="258" fill="#77879b" font-family="monospace" font-size="12">telemetría →</text>
  <text x="756" y="258" fill="#77879b" font-family="monospace" font-size="12">← envío</text>

  <!-- Account note -->
  <rect x="64" y="624" width="1072" height="76" fill="#0b131d" stroke="#1c2937"/>
  <text x="88" y="654" fill="#efb77a" font-family="monospace" font-size="12" letter-spacing="2">LEYENDA / DATOS INVENTADOS</text>
  <text x="88" y="680" fill="#aab7c8" font-family="monospace" font-size="13">Las cuentas, direcciones y eventos de este diagrama no existen. Se usan para explicar el formato del informe.</text>

  <text x="1136" y="716" text-anchor="end" fill="#1c2937" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="6">DEMO</text>
</svg>
