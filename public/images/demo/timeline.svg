<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Línea de tiempo sintética de autenticación</title>
  <desc id="desc">Diagrama de demostración con eventos de autenticación ficticios entre las 09:00 y las 10:00 UTC.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#162433" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56dce8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#56dce8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#08101a"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.75"/>

  <text x="64" y="62" fill="#56dce8" font-family="monospace" font-size="15" letter-spacing="3">DEMO / SYNTHETIC TIMELINE</text>
  <text x="1136" y="62" text-anchor="end" fill="#77879b" font-family="monospace" font-size="13" letter-spacing="2">NOT REAL EVIDENCE</text>

  <text x="64" y="120" fill="#e8eff7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Autenticación · reconstrucción temporal</text>
  <text x="64" y="152" fill="#77879b" font-family="monospace" font-size="14">Ventana de ejemplo · 08 nov 2026 · UTC</text>

  <line x1="64" y1="178" x2="1136" y2="178" stroke="#1c2937"/>

  <!-- Axis -->
  <line x1="92" y1="430" x2="1108" y2="430" stroke="#2b3c50" stroke-width="1.2"/>
  <g fill="#77879b" font-family="monospace" font-size="12">
    <text x="92" y="464" text-anchor="middle">09:00</text>
    <text x="262" y="464" text-anchor="middle">09:10</text>
    <text x="432" y="464" text-anchor="middle">09:20</text>
    <text x="602" y="464" text-anchor="middle">09:30</text>
    <text x="772" y="464" text-anchor="middle">09:40</text>
    <text x="942" y="464" text-anchor="middle">09:50</text>
    <text x="1108" y="464" text-anchor="middle">10:00</text>
  </g>
  <g stroke="#2b3c50" stroke-width="1">
    <line x1="262" y1="424" x2="262" y2="436"/>
    <line x1="432" y1="424" x2="432" y2="436"/>
    <line x1="602" y1="424" x2="602" y2="436"/>
    <line x1="772" y1="424" x2="772" y2="436"/>
    <line x1="942" y1="424" x2="942" y2="436"/>
    <line x1="1108" y1="424" x2="1108" y2="436"/>
  </g>

  <!-- Event 1 -->
  <line x1="190" y1="430" x2="190" y2="342" stroke="#efb77a" stroke-width="1"/>
  <circle cx="190" cy="430" r="4" fill="#efb77a"/>
  <rect x="118" y="252" width="244" height="90" fill="#0b131d" stroke="#3a3026"/>
  <text x="136" y="278" fill="#efb77a" font-family="monospace" font-size="11" letter-spacing="1">09:14:02 UTC / 4625</text>
  <text x="136" y="304" fill="#e8eff7" font-family="monospace" font-size="14">5 fallos de autenticación</text>
  <text x="136" y="326" fill="#77879b" font-family="monospace" font-size="12">Origen 198.51.100.24</text>

  <!-- Event 2 -->
  <line x1="330" y1="430" x2="330" y2="154" stroke="#efb77a" stroke-width="1"/>
  <circle cx="330" cy="430" r="4" fill="#efb77a"/>
  <rect x="274" y="196" width="264" height="82" fill="#0b131d" stroke="#3a3026"/>
  <text x="292" y="222" fill="#efb77a" font-family="monospace" font-size="11" letter-spacing="1">09:16:20 / 4625 × 12</text>
  <text x="292" y="248" fill="#e8eff7" font-family="monospace" font-size="13">Patrón repetido</text>
  <text x="292" y="268" fill="#77879b" font-family="monospace" font-size="12">Misma cuenta / misma IP</text>

  <!-- Event 3 -->
  <line x1="482" y1="430" x2="482" y2="520" stroke="#56dce8" stroke-width="1"/>
  <circle cx="482" cy="430" r="4" fill="#56dce8"/>
  <rect x="424" y="520" width="252" height="82" fill="#0b131d" stroke="#1f3b44"/>
  <text x="442" y="546" fill="#56dce8" font-family="monospace" font-size="11" letter-spacing="1">09:18:04 / 4624</text>
  <text x="442" y="572" fill="#e8eff7" font-family="monospace" font-size="13">Acceso correcto</text>
  <text x="442" y="592" fill="#77879b" font-family="monospace" font-size="12">Origen interno 192.0.2.15</text>

  <!-- Event 4 -->
  <line x1="670" y1="430" x2="670" y2="342" stroke="#efb77a" stroke-width="1"/>
  <circle cx="670" cy="430" r="4" fill="#efb77a"/>
  <rect x="598" y="252" width="246" height="90" fill="#0b131d" stroke="#3a3026"/>
  <text x="616" y="278" fill="#efb77a" font-family="monospace" font-size="11" letter-spacing="1">09:21:37 / 4625</text>
  <text x="616" y="304" fill="#e8eff7" font-family="monospace" font-size="14">Reintento posterior</text>
  <text x="616" y="326" fill="#77879b" font-family="monospace" font-size="12">Sin contexto de endpoint</text>

  <!-- Unresolved marker -->
  <line x1="1000" y1="430" x2="1000" y2="342" stroke="#2b3c50" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="1000" cy="430" r="4" fill="#08101a" stroke="#77879b"/>
  <rect x="916" y="252" width="190" height="90" fill="#0b131d" stroke="#1c2937"/>
  <text x="934" y="278" fill="#77879b" font-family="monospace" font-size="11" letter-spacing="1">09:35 / SIN DATOS</text>
  <text x="934" y="304" fill="#aab7c8" font-family="monospace" font-size="13">Actividad no cubierta</text>
  <text x="934" y="326" fill="#77879b" font-family="monospace" font-size="11">Limitación del escenario</text>

  <!-- Legend -->
  <rect x="64" y="642" width="1072" height="60" fill="#0b131d" stroke="#1c2937"/>
  <circle cx="92" cy="672" r="4" fill="#efb77a"/>
  <text x="108" y="677" fill="#aab7c8" font-family="monospace" font-size="12">Fallo de autenticación</text>
  <circle cx="306" cy="672" r="4" fill="#56dce8"/>
  <text x="322" y="677" fill="#aab7c8" font-family="monospace" font-size="12">Acceso correcto</text>
  <line x1="504" y1="672" x2="532" y2="672" stroke="#77879b" stroke-dasharray="3 4"/>
  <text x="544" y="677" fill="#aab7c8" font-family="monospace" font-size="12">Hueco de visibilidad</text>
  <text x="1108" y="677" text-anchor="end" fill="#77879b" font-family="monospace" font-size="11">ILUSTRACIÓN / NO ES UNA CAPTURA</text>
</svg>
