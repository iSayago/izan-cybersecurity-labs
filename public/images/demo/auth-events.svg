<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Distribución sintética de fallos de autenticación</title>
  <desc id="desc">Gráfico de barras de demostración con cuentas ficticias y recuentos inventados.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#162433" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#08101a"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.75"/>

  <text x="64" y="62" fill="#56dce8" font-family="monospace" font-size="15" letter-spacing="3">DEMO / SYNTHETIC DATA</text>
  <text x="1136" y="62" text-anchor="end" fill="#77879b" font-family="monospace" font-size="13" letter-spacing="2">NOT REAL EVIDENCE</text>

  <text x="64" y="122" fill="#e8eff7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Fallos de autenticación por cuenta</text>
  <text x="64" y="154" fill="#77879b" font-family="monospace" font-size="14">Conjunto sintético · ventana de 30 minutos · recuentos inventados</text>

  <line x1="64" y1="184" x2="1136" y2="184" stroke="#1c2937"/>

  <!-- Chart baseline -->
  <g stroke="#2b3c50" stroke-width="1">
    <line x1="128" y1="610" x2="1088" y2="610"/>
    <line x1="128" y1="510" x2="1088" y2="510" stroke-dasharray="3 5" opacity="0.6"/>
    <line x1="128" y1="410" x2="1088" y2="410" stroke-dasharray="3 5" opacity="0.6"/>
    <line x1="128" y1="310" x2="1088" y2="310" stroke-dasharray="3 5" opacity="0.6"/>
    <line x1="128" y1="210" x2="1088" y2="210" stroke-dasharray="3 5" opacity="0.6"/>
  </g>
  <g fill="#77879b" font-family="monospace" font-size="12" text-anchor="end">
    <text x="112" y="614">0</text>
    <text x="112" y="514">5</text>
    <text x="112" y="414">10</text>
    <text x="112" y="314">15</text>
    <text x="112" y="214">20</text>
  </g>

  <!-- Bars: counts 12,4,9,2,16,6,3,11,5,8,1,7 -->
  <g>
    <rect x="160" y="370" width="48" height="240" fill="#efb77a" opacity="0.82"/>
    <rect x="232" y="530" width="48" height="80" fill="#2b3c50"/>
    <rect x="304" y="430" width="48" height="180" fill="#efb77a" opacity="0.55"/>
    <rect x="376" y="570" width="48" height="40" fill="#2b3c50"/>
    <rect x="448" y="290" width="48" height="320" fill="#efb77a"/>
    <rect x="520" y="490" width="48" height="120" fill="#2b3c50"/>
    <rect x="592" y="550" width="48" height="60" fill="#2b3c50"/>
    <rect x="664" y="390" width="48" height="220" fill="#efb77a" opacity="0.7"/>
    <rect x="736" y="510" width="48" height="100" fill="#2b3c50"/>
    <rect x="808" y="450" width="48" height="160" fill="#efb77a" opacity="0.45"/>
    <rect x="880" y="590" width="48" height="20" fill="#2b3c50"/>
    <rect x="952" y="470" width="48" height="140" fill="#2b3c50"/>
  </g>

  <!-- Account labels -->
  <g fill="#77879b" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="184" y="634">analyst</text>
    <text x="256" y="634">svc_backup</text>
    <text x="328" y="634">analyst</text>
    <text x="400" y="634">helpdesk</text>
    <text x="472" y="634">admin</text>
    <text x="544" y="634">lab_user</text>
    <text x="616" y="634">test</text>
    <text x="688" y="634">analyst</text>
    <text x="760" y="634">svc_sql</text>
    <text x="832" y="634">intern</text>
    <text x="904" y="634">guest</text>
    <text x="976" y="634">lab_user</text>
  </g>

  <!-- Highlight -->
  <rect x="448" y="270" width="48" height="16" fill="#56dce8"/>
  <text x="472" y="256" text-anchor="middle" fill="#56dce8" font-family="monospace" font-size="12">16</text>

  <!-- Legend -->
  <rect x="64" y="672" width="1072" height="48" fill="#0b131d" stroke="#1c2937"/>
  <rect x="88" y="688" width="10" height="10" fill="#efb77a"/>
  <text x="108" y="698" fill="#aab7c8" font-family="monospace" font-size="12">Cuenta con patrón repetido</text>
  <rect x="342" y="688" width="10" height="10" fill="#2b3c50"/>
  <text x="362" y="698" fill="#aab7c8" font-family="monospace" font-size="12">Actividad sin contexto suficiente</text>
  <text x="1108" y="698" text-anchor="end" fill="#77879b" font-family="monospace" font-size="11">DATOS INVENTADOS / DEMO</text>
</svg>
